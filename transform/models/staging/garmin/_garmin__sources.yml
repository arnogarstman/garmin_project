version: 2

sources:
  - name: garmin
    description: >
      Raw Garmin Connect API responses landed by `uv run ingest garmin` in raw.payloads, shared by
      all sources. Read it through base_garmin__payloads, which keeps this source's rows.
    schema: raw
    tables:
      - name: payloads
        description: Append-only; a record is written only when its payload is new or changed.
        config:
          meta:
            dagster:
              asset_key: [raw, garmin]  # written by the raw ingest step in Dagster
        columns:
          - name: endpoint
            description: Logical endpoint name set by the source, e.g. sleep or activities.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - daily_summary
                      - sleep
                      - hrv
                      - training_readiness
                      - training_status
                      - weigh_ins
                      - race_predictions
                      - activity
                      - device_last_used
                      - heart_rate_zones
          - name: params
            description: Request parameters; per-day endpoints carry {"date"}, activities {"activity_id"}.
          - name: payload
            description: The API response, untouched.

  - name: ingest
    description: >
      Ingest run log in raw.loads, one row per successful run per source, written in the same
      transaction as the run's records.
    schema: raw
    tables:
      - name: loads
        config:
          meta:
            dagster:
              asset_key: [raw, garmin_loads]  # the same step's run markers
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 72, period: hour}
