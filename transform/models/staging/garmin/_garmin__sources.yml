version: 2

sources:
  - name: garmin
    description: Raw Garmin Connect API responses, one row per call, landed by `uv run ingest garmin`.
    schema: raw
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: payloads
        identifier: garmin
        columns:
          - name: endpoint
            description: Logical endpoint name set by the source, e.g. sleep or activities.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [daily_summary, sleep, hrv, training_readiness, training_status, activities, device_last_used]
          - name: params
            description: Request parameters; per-day endpoints carry {"date"}.
          - name: payload
            description: The API response, untouched.
