version: 2

models:
  - name: stg_coach__workout_reviews
    description: Claude's review of an activity. One row per activity; a newer review replaces an older one.
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [good, watch, concern]
