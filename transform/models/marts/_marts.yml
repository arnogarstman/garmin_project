version: 2

models:
  - name: fct_daily_health
    description: Recovery and wellness metrics per day. One row per ingested day.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: sleep_score
        data_tests:
          - value_in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: body_battery_highest
        data_tests:
          - value_in_range:
              arguments: {min_value: 0, max_value: 100}

  - name: fct_activities
    description: One row per Garmin activity, including minutes in each heart rate zone.
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: activity_date
        data_tests: [not_null]

  - name: fct_daily_energy
    description: >
      Energy per day: Garmin's total calories burned (resting plus active; today's is partial),
      the day's workouts and the weigh-in average. One row per ingested day.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: workouts
        data_tests: [not_null]

  - name: fct_coach_workouts
    description: >
      Garmin Coach's adaptive plan, one row per scheduled workout: name, pace description,
      estimated duration, training effect and completion status, as Garmin last reported them.
    columns:
      - name: workout_uuid
        data_tests: [unique, not_null]
      - name: calendar_date
        data_tests: [not_null]

  - name: fct_workout_reviews
    description: >
      Claude's review of a workout (see the coach source), with the activity it reviews.
      One row per reviewed activity; went_well and watch_out are lists.
    columns:
      - name: activity_id
        data_tests: [unique, not_null]

  - name: fct_race_results
    description: >
      Half marathon and marathon results with progression per distance: previous time,
      improvement and personal best to date. One row per qualifying run.
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: race_distance
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Half marathon, Marathon]
      - name: finish_time_s
        data_tests: [not_null]

  - name: fct_race_predictions
    description: Garmin's predicted 5K, 10K, half marathon and marathon times, in seconds. One row per day.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]

  - name: fct_daily_body
    description: Weight and body composition, averaged over the day's weigh-ins. One row per day with a weigh-in.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: body_fat_pct
        data_tests:
          - value_in_range:
              arguments: {min_value: 0, max_value: 100}

  - name: fct_sleep_effects
    description: >
      One row per night with sleep, on the day it ends, beside what followed: the morning's HRV,
      resting heart rate and readiness, the day's runs (aerobic efficiency against the 42 days
      before) and the morning weigh-in with its change since the day before. For the page's Sleep tab.
    columns:
      - name: calendar_date
        data_tests: [unique, not_null]
      - name: run_efficiency_vs_base
        description: >
          Distance-weighted efficiency (m/min per bpm) of the day's runs relative to the runs of the
          42 days before; 0.05 is 5% more speed per heartbeat. Null with fewer than 3 runs in that window.
      - name: weight_change_kg
        description: Weight minus the weigh-in of the day before; null without one.

  - name: rpt_heart_rate_zones
    description: Current heart rate zone floors (bpm) per sport.
    columns:
      - name: sport
        data_tests: [unique, not_null]

  - name: rpt_current_status
    description: >
      Latest known training status, readiness, body battery, resting HR, weight and race
      predictions. Always one row.

  - name: rpt_garmin_freshness
    description: Freshness signals with age and a stale flag. View; ages are relative to query time.
    columns:
      - name: signal
        data_tests: [unique, not_null]

  - name: rpt_metric_coverage
    description: One row per day and metric, with whether the metric has data that day.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [calendar_date, metric]
    columns:
      - name: metric
        data_tests:
          - accepted_values:
              arguments:
                values: [summary, steps, stress, body_battery, sleep, hrv, readiness]

  - name: rpt_metric_lag
    description: Latest day with data, days behind today and completeness per metric. View.
    columns:
      - name: metric
        data_tests: [unique, not_null]

unit_tests:
  - name: race_results_detect_races_and_track_progression
    description: >
      Runs within a distance band count as races of that distance; other distances and
      non-running activities do not. Progression is per distance: improvement against the
      previous race, the personal best so far, and whether a race set a new personal best.
    model: fct_race_results
    given:
      - input: ref('stg_garmin__activities')
        rows:
          - {activity_id: 1, activity_type: running, started_at_local: "2025-04-06 09:00:00", distance_m: 21200, duration_s: 6300, event_type: uncategorized}
          - {activity_id: 2, activity_type: running, started_at_local: "2025-10-12 09:00:00", distance_m: 21150, duration_s: 6000, event_type: race}
          - {activity_id: 3, activity_type: running, started_at_local: "2026-04-05 09:00:00", distance_m: 21300, duration_s: 6100, event_type: uncategorized}
          - {activity_id: 4, activity_type: running, started_at_local: "2026-05-10 09:00:00", distance_m: 42400, duration_s: 14000, event_type: race}
          - {activity_id: 5, activity_type: running, started_at_local: "2026-05-20 09:00:00", distance_m: 16000, duration_s: 4800, event_type: uncategorized}
          - {activity_id: 6, activity_type: cycling, started_at_local: "2026-05-21 09:00:00", distance_m: 21100, duration_s: 2700, event_type: uncategorized}
    expect:
      rows:
        - {activity_id: 1, race_distance: Half marathon, race_number: 1, improvement_vs_previous_s: null, personal_best_to_date_s: 6300, is_personal_best: true, is_tagged_race: false}
        - {activity_id: 2, race_distance: Half marathon, race_number: 2, improvement_vs_previous_s: 300, personal_best_to_date_s: 6000, is_personal_best: true, is_tagged_race: true}
        - {activity_id: 3, race_distance: Half marathon, race_number: 3, improvement_vs_previous_s: -100, personal_best_to_date_s: 6000, is_personal_best: false, is_tagged_race: false}
        - {activity_id: 4, race_distance: Marathon, race_number: 1, improvement_vs_previous_s: null, personal_best_to_date_s: 14000, is_personal_best: true, is_tagged_race: true}

  - name: sleep_effects_compare_runs_with_their_base_and_weight_with_the_day_before
    model: fct_sleep_effects
    given:
      - input: ref('stg_garmin__sleep')
        rows:
          - {calendar_date: "2026-05-03", sleep_seconds: 21600, sleep_started_at_local: "2026-05-03 00:30:00"}
          - {calendar_date: "2026-05-05", sleep_seconds: 27000, sleep_started_at_local: "2026-05-04 23:30:00"}
      - input: ref('fct_daily_health')
        rows:
          - {calendar_date: "2026-05-05", hrv_last_night_avg: 60}
      - input: ref('fct_activities')
        rows:
          - {activity_date: "2026-04-01", started_at_local: "2026-04-01 08:00:00", activity_type: running, distance_km: 10, duration_min: 50, pace_min_per_km: 5, avg_hr: 200, is_tagged_race: false}
          - {activity_date: "2026-04-10", started_at_local: "2026-04-10 08:00:00", activity_type: running, distance_km: 10, duration_min: 50, pace_min_per_km: 5, avg_hr: 200, is_tagged_race: false}
          - {activity_date: "2026-04-20", started_at_local: "2026-04-20 08:00:00", activity_type: running, distance_km: 10, duration_min: 50, pace_min_per_km: 5, avg_hr: 200, is_tagged_race: false}
          - {activity_date: "2026-05-03", started_at_local: "2026-05-03 08:00:00", activity_type: running, distance_km: 21, duration_min: 90, pace_min_per_km: 4.3, avg_hr: 170, is_tagged_race: true}
          - {activity_date: "2026-05-05", started_at_local: "2026-05-05 08:00:00", activity_type: running, distance_km: 10, duration_min: 50, pace_min_per_km: 5, avg_hr: 160, is_tagged_race: false}
      - input: ref('fct_daily_body')
        rows:
          - {calendar_date: "2026-05-02", weight_kg: 81.0}
          - {calendar_date: "2026-05-04", weight_kg: 80.5}
          - {calendar_date: "2026-05-05", weight_kg: 80.0}
    expect:
      rows:
        - {calendar_date: "2026-05-03", sleep_hours: 6.0, bedtime_hour: 24.5, runs: 0, run_efficiency_vs_base: null, weight_change_kg: null, hrv: null}
        - {calendar_date: "2026-05-05", sleep_hours: 7.5, bedtime_hour: 23.5, runs: 1, run_efficiency_vs_base: 0.25, weight_change_kg: -0.5, hrv: 60}
