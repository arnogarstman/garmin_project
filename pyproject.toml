[project]
name = "garminreader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "dagster>=1.11",
    "dagster-dbt>=0.27",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "fsspec>=2024.6",
    "garminconnect>=0.3.2",
    "pydantic>=2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ingest = "garminreader.ingest.cli:main"
transform = "garminreader.transform:main"
pipeline = "garminreader.orchestration.cli:main"
snapshot = "garminreader.snapshot.cli:main"
doctor = "garminreader.doctor:main"
garmin-tokens = "garminreader.ingest.sources.garmin.tokens:main"
workout-check = "garminreader.ingest.sources.garmin.workout_check:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagster-webserver>=1.11",
    "ipykernel>=7.4.0",
    "mypy>=1.18",
    "nbformat>=5.11.1",
    # The notebooks only.
    "pandas>=2.2",
    "plotly>=5.22",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.uv]
# cryptography ships no Intel macOS wheels from 49 on, and building it needs a Rust/OpenSSL toolchain.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.dagster]
module_name = "garminreader.orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["garminconnect.*", "dbt.*", "fsspec.*", "dagster_dbt.*"]
ignore_missing_imports = true
