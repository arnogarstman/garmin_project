[project]
name = "garminreader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "duckdb>=1.5.6",
    "garminconnect>=0.3.2",
    "pandas>=2.2",
    "plotly>=5.22",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.38",
]

[project.scripts]
ingest = "garminreader.ingest.cli:main"
dashboard = "garminreader.dashboard.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=1.18",
    "nbformat>=5.11.1",
    "pandas-stubs>=2.2",
    "pytest>=9.1.1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# UI glyphs (en dash placeholder, info emoji) are intentional.
"src/garminreader/dashboard/app.py" = ["RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["garminconnect.*", "plotly.*"]
ignore_missing_imports = true

# TEMPORARY: legacy dashboard code is typed when it moves onto dbt marts.
[[tool.mypy.overrides]]
module = ["garminreader.dashboard.*"]
ignore_errors = true
