name: refresh
run-name: ${{ github.event.schedule == '*/30 4-20 * * *' && 'Workout check' || github.event_name == 'schedule' && 'Daily refresh' || 'Refresh' }}

# The data refresh: Garmin Connect into MotherDuck, Claude's review of each new workout, then every
# dbt model, test and check. Runs in full every morning; through the day a check every 30 minutes
# asks Garmin for the newest activity and runs the refresh only when the warehouse lacks it, so a
# workout is in the warehouse, reviewed, within about 45 minutes of the watch syncing. Once today's
# workout is in, the checks stop asking Garmin until the next day.
# Garmin is only reached with the saved session (GARMIN_TOKENS), never with a password login,
# and a session Garmin refreshes during the run is written back to the secret for the next run.
# See "Scheduled refresh" in the README for the secrets and the yearly token renewal.

on:
  schedule:
    # 04:17 UTC: 06:17 in Amsterdam in summer, 05:17 in winter. Off the hour, when GitHub's
    # scheduler is least busy.
    - cron: "17 4 * * *"
    # The workout check: every 30 minutes from 04:00 to 20:30 UTC, which covers 06:00 to 22:00 in
    # Amsterdam in summer and winter; the check itself skips the hours outside that (see
    # workout_check.py). Keep this string equal to the one in the run-name and the check step.
    - cron: "*/30 4-20 * * *"
  workflow_dispatch:
    inputs:
      partition:
        description: "Day to ingest, YYYY-MM-DD (default: today in Amsterdam)"
        required: false

permissions:
  contents: read

# Never two runs at once: they would both refresh, and race on, the same Garmin session.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Ingest, build and check
    # A self-hosted runner at home (repository variable REFRESH_RUNNER=self-hosted) moves the
    # Garmin calls to a residential IP address if Garmin starts refusing GitHub's.
    runs-on: ${{ vars.REFRESH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DATABASE: ${{ vars.DATABASE || 'md:garmin' }}
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      # Optional: without it the run skips the workout reviews.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GARMIN_PASSWORD_LOGIN: "false"
      GARMIN_TOKEN_DIR: .garmin_tokens
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # Fail in seconds on a missing secret. Without MOTHERDUCK_TOKEN, DuckDB would otherwise
      # wait for an interactive MotherDuck login.
      - name: Check the secrets
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: |
          missing=""
          [ -n "$MOTHERDUCK_TOKEN" ] || missing="$missing MOTHERDUCK_TOKEN"
          [ -n "$GARMIN_TOKENS" ] || missing="$missing GARMIN_TOKENS"
          [ -n "$SECRETS_TOKEN" ] || missing="$missing SECRETS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See \"Scheduled refresh\" in the README."
            exit 1
          fi

      - run: uv sync --locked

      - name: Restore the Garmin session
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          umask 077
          mkdir -p "$GARMIN_TOKEN_DIR"
          printf '%s' "$GARMIN_TOKENS" > "$GARMIN_TOKEN_DIR/garmin_tokens.json"

      # The frequent schedule only: one Garmin call. Prints new=true or new=false; the steps
      # below run when it found a new workout, and always on the daily or a manual run.
      - name: Look for a new workout
        id: check
        if: github.event.schedule == '*/30 4-20 * * *'
        run: uv run workout-check >> "$GITHUB_OUTPUT"

      # Every connection (Garmin with the saved session, MotherDuck, dbt) in one overview,
      # before the pipeline starts.
      - name: Check the connections
        if: steps.check.outputs.new != 'false'
        run: uv run doctor

      - name: Run the pipeline
        if: steps.check.outputs.new != 'false'
        env:
          PARTITION: ${{ inputs.partition }}
        run: uv run pipeline ${PARTITION:+--partition "$PARTITION"}

      # Also after a failed run: the session may have been refreshed before the failure. Only a new
      # refresh token is worth saving: the access token is short-lived and every run mints a fresh
      # one from the refresh token, so a changed access token alone leaves the secret valid.
      - name: Save a refreshed Garmin session
        if: always()
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
        run: |
          file="$GARMIN_TOKEN_DIR/garmin_tokens.json"
          refresh_token() { python3 -c 'import json, sys; print(json.loads(sys.stdin.read() or "{}").get("di_refresh_token") or "")'; }
          if [ ! -s "$file" ] || [ "$(refresh_token < "$file")" = "$(printf '%s' "$GARMIN_TOKENS" | refresh_token)" ]; then
            echo "Garmin refresh token unchanged; the saved session stays valid."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Garmin issued a new refresh token but SECRETS_TOKEN is not set, so the next run may fail. See the README."
            exit 1
          fi
          if ! gh secret set GARMIN_TOKENS --repo "$GITHUB_REPOSITORY" < "$file"; then
            echo "::error::Garmin issued a new refresh token but saving it failed. SECRETS_TOKEN needs the permission 'Secrets: Read and write' on this repository; see the README."
            exit 1
          fi
          echo "Saved the new Garmin refresh token to the GARMIN_TOKENS secret."

      - name: Remove the Garmin session from the runner
        if: always()
        run: rm -rf "$GARMIN_TOKEN_DIR"
